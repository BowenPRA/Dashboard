<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="#f8fafc" rx="32" />

  <rect x="40" y="40" width="340" height="370" fill="#ffffff" rx="24" filter="url(#shadow)" />
  <rect x="40" y="40" width="340" height="370" fill="none" stroke="#58cc02" stroke-width="4" rx="24" />
  <rect x="40" y="40" width="340" height="100" fill="#f1fbee" rx="20" />
  
  <circle cx="210" cy="90" r="28" fill="#58cc02" />
  <path d="M198 90 l8 8 l16 -16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <text x="210" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#3e7500" text-anchor="middle" letter-spacing="2">FACT</text>
  <text x="210" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#58cc02" text-anchor="middle" letter-spacing="1">OBJECTIVE TRUTH</text>

  <circle cx="70" cy="235" r="6" fill="#58cc02" />
  <text x="90" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#334155">Can be proven true or false.</text>

  <circle cx="70" cy="285" r="6" fill="#58cc02" />
  <text x="90" y="290" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#334155">Relies on physical evidence.</text>

  <circle cx="70" cy="335" r="6" fill="#58cc02" />
  <text x="90" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#334155">Remains true for everyone.</text>


  <rect x="420" y="40" width="340" height="370" fill="#ffffff" rx="24" filter="url(#shadow)" />
  <rect x="420" y="40" width="340" height="370" fill="none" stroke="#ff9600" stroke-width="4" rx="24" />
  <rect x="420" y="40" width="340" height="100" fill="#fffaf0" rx="20" />
  
  <circle cx="590" cy="90" r="28" fill="#ff9600" />
  <path d="M578 95 c0 -15 24 -15 24 0 c0 10 -10 10 -10 15 c-5 -5 -14 -5 -14 -15 z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <text x="590" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#cc7800" text-anchor="middle" letter-spacing="2">OPINION</text>
  <text x="590" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#ff9600" text-anchor="middle" letter-spacing="1">SUBJECTIVE BELIEF</text>

  <circle cx="450" cy="235" r="6" fill="#ff9600" />
  <text x="470" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#334155">Based on personal feelings.</text>

  <circle cx="450" cy="285" r="6" fill="#ff9600" />
  <text x="470" y="290" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#334155">Cannot be universally proven.</text>

  <circle cx="450" cy="335" r="6" fill="#ff9600" />
  <text x="470" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#334155">Differs from person to person.</text>

  <circle cx="400" cy="225" r="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="url(#shadow)" />
  <text x="400" y="233" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#94a3b8" text-anchor="middle">VS</text>
</svg>
