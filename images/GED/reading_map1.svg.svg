<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="800" height="600" fill="#f8fafc" rx="32" />

  <rect x="150" y="50" width="500" height="120" fill="#ffffff" rx="24" filter="url(#shadow)" />
  <rect x="150" y="50" width="500" height="120" fill="none" stroke="#1cb0f6" stroke-width="4" rx="24" />
  <rect x="150" y="50" width="100" height="120" fill="#e0f6ff" rx="20" />
  <text x="200" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#1899d6" text-anchor="middle">1</text>
  <text x="280" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1e293b">The Claim</text>
  <text x="280" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#64748b">The main argument introduced at the beginning.</text>

  <line x1="400" y1="170" x2="400" y2="210" stroke="#94a3b8" stroke-width="6" stroke-dasharray="8,8" marker-end="url(#arrow)" />

  <rect x="150" y="230" width="500" height="140" fill="#ffffff" rx="24" filter="url(#shadow)" />
  <rect x="150" y="230" width="500" height="140" fill="none" stroke="#ce82ff" stroke-width="4" rx="24" />
  <rect x="150" y="230" width="100" height="140" fill="#f8eeff" rx="20" />
  <text x="200" y="315" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#a567cc" text-anchor="middle">2</text>
  <text x="280" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1e293b">Supporting Evidence</text>
  <text x="280" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#64748b">Facts, statistics, or quotes used to</text>
  <text x="280" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#64748b">prove the claim is true.</text>

  <line x1="400" y1="370" x2="400" y2="410" stroke="#94a3b8" stroke-width="6" stroke-dasharray="8,8" marker-end="url(#arrow)" />

  <rect x="150" y="430" width="500" height="120" fill="#ffffff" rx="24" filter="url(#shadow)" />
  <rect x="150" y="430" width="500" height="120" fill="none" stroke="#14b8a6" stroke-width="4" rx="24" />
  <rect x="150" y="430" width="100" height="120" fill="#e5fdfa" rx="20" />
  <text x="200" y="505" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#0d9488" text-anchor="middle">3</text>
  <text x="280" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1e293b">The Conclusion</text>
  <text x="280" y="510" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#64748b">Summarizes the point and transitions to next idea.</text>

</svg>
