<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade hub harness</title>
    <script>
      // Same bootstrap as index.html: ?theme=dark|light wins, else the saved theme.
      const q = new URLSearchParams(location.search).get('theme');
      const saved = localStorage.getItem('theme');
      if (q === 'dark' || (!q && saved === 'dark')) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview-arcadehub.jsx"></script>
  </body>
</html>
